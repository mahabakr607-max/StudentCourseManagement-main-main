<div class="change-password-page">
<app-navbar></app-navbar>
  <div class="change-password-container">

    <div class="page-header">

      <div class="icon">
        <i class="bi bi-key"></i>
      </div>

      <h1>Change Password</h1>

      <p>
        Update your account password
      </p>

    </div>


    <div class="password-card">

      <div
        *ngIf="msg"
        class="success-message"
      >
        <i class="bi bi-check-circle"></i>
        {{ msg }}
      </div>


      <div
        *ngIf="errorMsg"
        class="error-message"
      >
        <i class="bi bi-exclamation-circle"></i>
        {{ errorMsg }}
      </div>


      <form
        (ngSubmit)="onSubmit()"
      >

        <div class="input-group">

          <label>Old Password</label>

          <input
            type="password"
            [(ngModel)]="formData.oldPassword"
            name="oldPassword"
            required
            #oldPasswordInput
            (keydown.enter)="$event.preventDefault(); newPasswordInput.focus()"
          >

        </div>


        <div class="input-group">

          <label>New Password</label>

          <input
            type="password"
            [(ngModel)]="formData.newPassword"
            name="newPassword"
            required
            #newPasswordInput
            (keydown.enter)="$event.preventDefault(); confirmNewPasswordInput.focus()"
          >

        </div>


        <div class="input-group">

          <label>Confirm New Password</label>

          <input
            type="password"
            [(ngModel)]="formData.confirmNewPassword"
            name="confirmNewPassword"
            required
            #confirmNewPasswordInput
          >

        </div>


        <div class="form-actions">

          <button
            type="submit"
            class="save-btn"
            [disabled]="saving"
          >
            {{ saving ? 'Updating...' : 'Update Password' }}
          </button>


          
            <a routerLink="/profile"
            class="cancel-btn"
          >
            Cancel
          </a>

        </div>

      </form>

    </div>

  </div>

</div>
